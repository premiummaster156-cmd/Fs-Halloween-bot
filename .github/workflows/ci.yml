name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node-version }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check source
        run: find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate slash command definitions
        run: node -e "const commands = require('./src/commands').loadCommands(); for (const command of commands.values()) command.data.toJSON(); console.log('Validated ' + commands.size + ' commands')"
      - name: Run tests
        run: npm test
